# TranscribeVid live-visitor count: one Cloudflare Worker + one small D1 database (free plan).
# Separate from workers/counter on purpose: its own routes and its own database, so this one cannot break the
# "videos transcribed" counter.
#
#   POST /_live/ping?t=<random code>        a page that is open says "I am here" (about once a minute)
#   GET  /_live/now?key=<LIVE_KEY>         the owner's page with the number (&json=1 for {"active": n})
#
# Deploy (from this folder):  npx wrangler d1 create tv-live                           -> paste the database_id below
#                             npx wrangler d1 execute tv-live --remote --file schema.sql
#                             npx wrangler deploy
#                             npx wrangler secret put LIVE_KEY      -> a long random string; it is the owner's bookmark key
# The patterns end in * because a pattern without it does not match a URL that has a query string (?t=...). The routes are under /_live, not /api: workers/counter owns "transcribevid.com/api/*" and its wildcard outranks more specific routes.
name = "tv-live"
main = "src/index.ts"
compatibility_date = "2026-10-01"

workers_dev = false
routes = [
  { pattern = "transcribevid.com/_live/ping*", zone_name = "transcribevid.com" },
  { pattern = "transcribevid.com/_live/now*", zone_name = "transcribevid.com" },
]

# Optional clean-up job every 5 minutes (src/index.ts scheduled). Cloudflare only accepts cron triggers once the account has a
# workers.dev name (code 10063), so it is off; the Worker deletes quiet codes on every ping and read instead.
# [triggers]
# crons = ["*/5 * * * *"]

[vars]
# Comma-separated list of page origins allowed to ping.
ALLOWED_ORIGINS = "https://transcribevid.com"

[[d1_databases]]
binding = "DB"
database_name = "tv-live"
database_id = "3162363a-ecf3-46c2-a6f4-a9ae5fa474a9"

# Per-IP limit on POST /_live/ping: Cloudflare's Workers Rate Limiting binding (free). A page pings once a minute; 20 leaves
# room for several people behind one address. If this wrangler version rejects the block, delete it: src/core.ts then
# falls back to a per-isolate in-memory limit with the same numbers.
[[ratelimits]]
name = "PING_LIMITER"
namespace_id = "1002"
simple = { limit = 20, period = 60 }
